name: Deploy review app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["review/**", "core/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site (review app + shared core, so ../core imports resolve)
        run: |
          mkdir -p _site
          cp -r review _site/review
          cp -r core _site/core
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=review/"><a href="review/">Puzzle Review</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
